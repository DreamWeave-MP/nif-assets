# nif-assets as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `nif_assets-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "9ff24c72-d67c-44d1-9af4-4c102dff10ef"
slug = "nif_assets"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.nif-assets"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.1.1"
date = 2026-10-24
summary = "A report on a whole mods folder no longer fails with `table overflow`: it is written a file at a time."
fixed = [
    "`check`, `info` and `fix` write their report to standard output a file at a time, as the same text, so a run over tens of thousands of NIFs never builds its whole document as one string. Needs jess 0.2.2 or later, whose YAML and JSON writers no longer overflow a table on a document of millions of lines.",
]
