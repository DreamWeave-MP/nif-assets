# nif-assets as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `nif_assets-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "9ff24c72-d67c-44d1-9af4-4c102dff10ef"
slug = "nif_assets"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.nif-assets"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
